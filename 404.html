<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı · Peri Golf</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C2562C">
<style>
  :root { --bg: #F7EBDC; --ink: #211612; --mid: #523B2F; --terra: #C2562C; --edge: #7A502D; }
  @media (prefers-color-scheme: dark) { :root { --bg: #2B1A2E; --ink: #F7EBDC; --mid: #EBD4B8; --terra: #E8825B; --edge: #D1B08C; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", sans-serif; }
  main { max-width: 440px; text-align: center; }
  h1 { margin: 0 0 8px; font-size: 56px; color: var(--terra); }
  p { margin: 0 0 20px; line-height: 1.5; color: var(--mid); }
  a { display: inline-block; margin: 4px; padding: 12px 20px; min-height: 44px; border: 2px solid var(--edge); border-radius: 14px; color: var(--ink); font-weight: 700; text-decoration: none; }
  a.primary { background: var(--terra); border-color: var(--terra); color: #fff; }
  a:focus-visible { outline: 3px solid var(--terra); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>404</h1>
  <p>Bu adreste bir şey yok; top deliğe girmemiş. Oyuna ya da diğer oyunlara dönebilirsin.<br><small>Nothing here. Head back to the game or the other games.</small></p>
  <a class="primary" href="https://furkiozknn.github.io/peri-golf/">Peri Golf'e dön</a>
  <a href="https://furkiozknn.github.io/">Diğer oyunlar</a>
</main>
</body>
</html>
