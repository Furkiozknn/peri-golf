<style>
/* ==========================================================================
   PERİ GOLF UI REBORN: KAPADOKYA MİNYATÜR DİORAMA VE TAŞ-TOPRAK ZANAATI
   ========================================================================== */
:root {
  /* Volcanic Tuff & Cappadocia Stone */
  --tuff-light: #F7EBDC;
  --tuff-1: #EBD4B8;
  --tuff-2: #D1B08C;
  --tuff-mid: #B88B5D;
  --tuff-dark: #7A502D;
  --tuff-deep: #4A2B14;
  
  /* Terracotta Pottery (Avanos Clay) */
  --terra: #C2562C;
  --terra-bright: #DE6B3D;
  --terra-dark: #8C3314;
  --terra-glow: rgba(194, 86, 44, 0.28);

  /* Regional Accents: Turquoise Glaze & Pigeon Valley Sage */
  --turq: #247B93;
  --turq-bright: #3FA6C3;
  --turq-bg: #E8F6F9;
  --sage: #4E7C45;
  --sage-bright: #6EA362;
  --sage-bg: #EEF7EC;
  
  /* Dawn Saffron Gold */
  --gold: #E5A328;
  --gold-bright: #FFCA48;
  --gold-bg: #FFF8E5;
  
  /* Hazards & Accents */
  --hazard: #C73838;
  --hazard-bg: #FDF0F0;
  
  /* Surfaces & Ink */
  --parchment: #FFFDF9;
  --parchment-2: #F9F2E6;
  --parchment-3: #F0E3CE;
  --ink: #211612;
  --ink-mid: #523B2F;
  --ink-muted: #795F51;
  --ink-faint: rgba(33, 22, 18, 0.45);
  
  --line: rgba(122, 80, 45, 0.22);
  --focus: #DE6B3D;
  --bg: #9AD1F5;

  /* Tactile Depth System */
  --shadow-sm: 0 2px 6px rgba(45, 26, 15, 0.12), 0 2px 0 var(--tuff-deep);
  --shadow-md: 0 6px 16px rgba(45, 26, 15, 0.16), 0 3px 0 var(--tuff-deep);
  --shadow-lg: 0 16px 36px rgba(45, 26, 15, 0.24), 0 4px 0 var(--tuff-deep);
  --shadow-relief: inset 0 1px 1px rgba(255, 255, 255, 0.75), inset 0 -2px 0 rgba(74, 43, 20, 0.18);

  /* Safe Area insets */
  --sa-t: env(safe-area-inset-top, 0px);
  --sa-b: env(safe-area-inset-bottom, 0px);
  --sa-l: env(safe-area-inset-left, 0px);
  --sa-r: env(safe-area-inset-right, 0px);
}

@font-face {
  font-family: 'Fredoka';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(assets/fonts/fredoka-latin-ext.woff2) format('woff2');
  unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF;
}
@font-face {
  font-family: 'Fredoka';
  font-style: normal;
  font-weight: 400 700;
  font-display: swap;
  src: url(assets/fonts/fredoka-latin.woff2) format('woff2');
  unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
}

*, *::before, *::after { box-sizing: border-box; }
::selection { background: var(--terra); color: #FFFDF9; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Fredoka', 'Plus Jakarta Sans', "Segoe UI", system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  text-rendering: optimizeLegibility;
}

#c {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  outline: none;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; padding: 0; background: none; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
svg { display: block; }

/* Custom themed scrollbars */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--parchment-3); border-radius: 6px; }
::-webkit-scrollbar-thumb { background: var(--tuff-mid); border-radius: 6px; border: 2px solid var(--parchment-3); }
::-webkit-scrollbar-thumb:hover { background: var(--tuff-dark); }

/* ==========================================================================
   SURFACE CONTAINERS & CRAFTED STONE FRAMES
   ========================================================================== */
.glass, .glass-stone {
  background: linear-gradient(175deg, var(--parchment) 0%, var(--parchment-2) 100%);
  border: 3px solid var(--tuff-dark);
  border-radius: 20px;
  box-shadow: var(--shadow-md), var(--shadow-relief);
}

/* ==========================================================================
   REBORN HUD: DUAL FLOATING ANCHORS + UNOBSTRUCTED CENTER SKY
   ========================================================================== */
.topbar {
  position: fixed;
  top: calc(10px + var(--sa-t));
  left: calc(10px + var(--sa-l));
  right: calc(10px + var(--sa-r));
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  background: transparent !important;
  border: 0 !important;
  box-shadow: none !important;
  pointer-events: none;
  z-index: 20;
}

/* Left telemetry capsule */
.hud-telemetry {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 6px 14px 6px 8px;
  background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-2) 100%);
  border: 2.5px solid var(--tuff-dark);
  border-radius: 18px;
  box-shadow: var(--shadow-md), var(--shadow-relief);
  animation: hudSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.topbar .brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--terra-dark);
  white-space: nowrap;
  padding-right: 6px;
  border-right: 2px solid var(--line);
}
.topbar .brand svg { width: 32px; height: 32px; filter: drop-shadow(0 2px 2px rgba(45,26,15,0.18)); }
.topbar .brand span { font-size: 18px; font-weight: 700; color: var(--terra); text-shadow: 0 1px 0 rgba(255,255,255,0.7); }

.topbar .stats {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--ink-mid);
}

.stat-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  border-radius: 12px;
  background: var(--parchment-3);
  border: 1.5px solid rgba(122, 80, 45, 0.25);
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-muted);
}
.stat-pill.highlight {
  background: var(--terra-soft);
  border-color: var(--terra);
  color: var(--terra-dark);
}
.stat-pill b {
  color: var(--ink);
  font-weight: 700;
  font-size: 16px;
  font-variant-numeric: tabular-nums;
}
.stat-pill.highlight b {
  color: var(--terra);
  font-size: 17px;
}
.stat-slash {
  font-size: 12px;
  opacity: 0.6;
}

/* Micro progress pips under HUD */
.hud-pips {
  display: flex;
  gap: 3px;
  padding: 0 2px;
}
.p-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--tuff-2);
  transition: all 0.2s;
}
.p-dot.cur {
  background: var(--terra);
  transform: scale(1.4);
  box-shadow: 0 0 6px var(--terra);
}
.p-dot.done {
  background: var(--sage);
}

/* Right control deck */
.topbar .acts {
  pointer-events: auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-2) 100%);
  border: 2.5px solid var(--tuff-dark);
  border-radius: 18px;
  box-shadow: var(--shadow-md), var(--shadow-relief);
  animation: hudSlideDown 0.35s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.ibtn {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  border: 2px solid var(--tuff-mid);
  background: var(--parchment-3);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-mid);
  font-weight: 700;
  font-size: 14px;
  box-shadow: 0 3px 0 var(--tuff-dark), 0 2px 4px rgba(45, 26, 15, 0.1);
  transition: transform 0.12s, box-shadow 0.12s, background 0.15s, color 0.15s;
}
.ibtn:hover {
  background: var(--gold-bg);
  border-color: var(--tuff-dark);
  color: var(--ink);
  transform: translateY(-1px);
  box-shadow: 0 4px 0 var(--tuff-dark), 0 4px 8px rgba(45, 26, 15, 0.15);
}
.ibtn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 var(--tuff-dark);
}
.ibtn.on {
  background: var(--turq-bg);
  border-color: var(--turq);
  color: var(--turq);
  box-shadow: 0 3px 0 var(--turq), inset 0 1px 2px rgba(36, 123, 147, 0.2);
}
.ibtn svg { width: 22px; height: 22px; }

/* ==========================================================================
   TOASTS & NOTIFICATIONS
   ========================================================================== */
.toasts {
  position: fixed;
  top: calc(76px + var(--sa-t));
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  z-index: 25;
  pointer-events: none;
  width: max-content;
  max-width: 92vw;
}
.toast {
  padding: 8px 18px;
  border-radius: 16px;
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.01em;
  animation: toastIn 0.28s cubic-bezier(0.16, 1, 0.3, 1);
  color: var(--ink);
  background: var(--gold-bg);
  border: 2.5px solid var(--tuff-dark);
  box-shadow: var(--shadow-md);
  display: flex;
  align-items: center;
  gap: 8px;
}
.toast.good {
  background: var(--sage-bg);
  border-color: var(--sage);
  color: var(--sage);
}
.toast.bad {
  background: var(--hazard-bg);
  border-color: var(--hazard);
  color: var(--hazard);
}
.toast.out {
  opacity: 0;
  transform: translateY(-8px) scale(0.96);
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(-12px) scale(0.92); }
  to { opacity: 1; transform: none; }
}

/* ==========================================================================
   TACTILE POWER METER & HINT
   ========================================================================== */
.power {
  position: fixed;
  left: calc(14px + var(--sa-l));
  bottom: calc(18px + var(--sa-b));
  width: 26px;
  height: 164px;
  border-radius: 14px;
  overflow: hidden;
  z-index: 15;
  background: var(--parchment-2);
  border: 3px solid var(--tuff-dark);
  box-shadow: var(--shadow-md), var(--shadow-relief);
}
.power i {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 0%;
  background: linear-gradient(to top, var(--sage-bright), var(--gold-bright) 55%, var(--terra-bright));
  transition: height 0.04s ease-out;
}
.power b {
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  bottom: 0;
  background: repeating-linear-gradient(to top, transparent 0 24%, rgba(74, 43, 20, 0.35) 24% 25%);
  pointer-events: none;
}
.power::after {
  content: 'GÜÇ';
  position: absolute;
  top: 4px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 8px;
  font-weight: 700;
  color: var(--ink-muted);
  letter-spacing: 0.05em;
  pointer-events: none;
}

.hint {
  position: fixed;
  bottom: calc(20px + var(--sa-b));
  left: 50%;
  transform: translateX(-50%);
  padding: 9px 20px;
  border-radius: 16px;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-2) 100%);
  border: 2.5px solid var(--tuff-dark);
  box-shadow: var(--shadow-md), var(--shadow-relief);
  z-index: 15;
  pointer-events: none;
  text-align: center;
  max-width: 90vw;
  letter-spacing: 0.01em;
}

/* ==========================================================================
   HOLE INTRO BANNER: ELEGANT, NON-INTRUSIVE & CRYSTAL CLEAR
   ========================================================================== */
.intro {
  position: fixed;
  top: calc(74px + var(--sa-t));
  left: 50%;
  transform: translateX(-50%);
  padding: 12px 22px 10px;
  text-align: center;
  z-index: 22;
  min-width: 280px;
  max-width: min(92vw, 420px);
  background: linear-gradient(180deg, var(--parchment) 0%, var(--parchment-2) 100%);
  border: 3px solid var(--tuff-dark);
  border-radius: 18px;
  box-shadow: var(--shadow-lg), var(--shadow-relief);
  animation: introDrop 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
  pointer-events: none;
}
.intro-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--terra-dark);
  background: var(--terra-soft);
  padding: 2px 10px;
  border-radius: 10px;
  margin-bottom: 4px;
}
.intro h2 {
  margin: 0;
  font-size: 24px;
  color: var(--terra);
  font-weight: 700;
  letter-spacing: -0.01em;
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
}
.intro p {
  margin: 6px 0 0;
  color: var(--ink-mid);
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.intro small {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 8px;
  padding: 3px 12px;
  border-radius: 10px;
  background: var(--parchment-3);
  color: var(--ink-muted);
  font-size: 12px;
  font-weight: 600;
  border: 1px dashed rgba(122, 80, 45, 0.35);
}
@keyframes introDrop {
  from { opacity: 0; transform: translate(-50%, -14px) scale(0.94); }
  to { opacity: 1; transform: translateX(-50%); }
}

/* ==========================================================================
   OVERLAYS, PANELS & CRAFTED BUTTONS
   ========================================================================== */
.overlay {
  position: fixed;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(33, 22, 18, 0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 30;
  padding: 16px;
  overflow: auto;
}
.panel {
  padding: 24px 26px;
  width: min(94vw, 480px);
  max-height: calc(100vh - 32px);
  overflow: auto;
  position: relative;
}
.panel h2 {
  margin: 0 0 16px;
  font-size: 28px;
  color: var(--terra);
  font-weight: 700;
  letter-spacing: -0.01em;
  text-align: center;
  text-shadow: 0 1px 0 rgba(255,255,255,0.8);
}

.col { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* Tactile 3D Buttons */
.btn {
  min-height: 48px;
  padding: 0 22px;
  border-radius: 16px;
  border: 2px solid var(--tuff-deep);
  background: var(--parchment-2);
  color: var(--ink);
  font-weight: 700;
  font-size: 16px;
  letter-spacing: 0.01em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  box-shadow: 0 4px 0 var(--tuff-deep), 0 6px 14px rgba(45, 26, 15, 0.16);
  transition: transform 0.12s, box-shadow 0.12s, background 0.15s;
}
.btn:hover {
  background: var(--parchment);
  transform: translateY(-2px);
  box-shadow: 0 6px 0 var(--tuff-deep), 0 8px 18px rgba(45, 26, 15, 0.2);
}
.btn:active {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--tuff-deep);
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: 0 2px 0 var(--tuff-deep) !important;
}
.btn.w { width: 100%; }
.btn svg { width: 22px; height: 22px; }

/* Button Color Variants */
.btn.primary {
  background: linear-gradient(180deg, var(--terra-bright) 0%, var(--terra) 100%);
  border-color: var(--terra-dark);
  color: #FFFDF9;
  box-shadow: 0 4px 0 var(--terra-dark), 0 6px 16px var(--terra-glow);
}
.btn.primary:hover {
  background: linear-gradient(180deg, #E67A4E 0%, var(--terra-bright) 100%);
  box-shadow: 0 6px 0 var(--terra-dark), 0 10px 20px var(--terra-glow);
}
.btn.primary:active {
  box-shadow: 0 1px 0 var(--terra-dark);
}

.btn.lemon {
  background: linear-gradient(180deg, var(--gold-bright) 0%, var(--gold) 100%);
  border-color: var(--tuff-dark);
  color: var(--ink);
  box-shadow: 0 4px 0 var(--tuff-dark), 0 6px 14px rgba(229, 163, 40, 0.25);
}
.btn.lemon:hover {
  background: linear-gradient(180deg, #FFD56B 0%, var(--gold-bright) 100%);
}

.btn.sky {
  background: linear-gradient(180deg, var(--turq-bright) 0%, var(--turq) 100%);
  border-color: #175769;
  color: #FFFDF9;
  box-shadow: 0 4px 0 #175769, 0 6px 14px rgba(36, 123, 147, 0.25);
}
.btn.sky:hover {
  background: linear-gradient(180deg, #51B8D5 0%, var(--turq-bright) 100%);
}

.btn.blush {
  background: linear-gradient(180deg, #E87A7A 0%, var(--hazard) 100%);
  border-color: #8A1F1F;
  color: #FFFDF9;
  box-shadow: 0 4px 0 #8A1F1F, 0 6px 14px rgba(199, 56, 56, 0.25);
}
.btn.blush:hover {
  background: linear-gradient(180deg, #ED8C8C 0%, #E87A7A 100%);
}

/* Sliders & Segmented Controls */
label.sl {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 15px;
  font-weight: 600;
  color: var(--ink-mid);
  padding: 4px 0;
}
label.sl span { width: 110px; font-weight: 700; color: var(--ink); }
input[type=range] {
  flex: 1;
  accent-color: var(--terra);
  height: 44px;
  margin: 0;
  cursor: pointer;
}

.seg {
  display: inline-flex;
  border: 2px solid var(--tuff-dark);
  border-radius: 14px;
  overflow: hidden;
  background: var(--parchment-3);
  box-shadow: 0 3px 0 var(--tuff-deep);
}
.seg button {
  min-height: 44px;
  min-width: 68px;
  padding: 0 16px;
  border: 0;
  background: transparent;
  font-weight: 700;
  font-size: 15px;
  color: var(--ink-muted);
  transition: background 0.16s, color 0.16s;
}
.seg button.on {
  background: var(--gold-bg);
  color: var(--ink);
  box-shadow: inset 0 2px 0 rgba(74, 43, 20, 0.1);
}
.seg button:hover:not(.on) {
  background: rgba(255,255,255,0.4);
}

.footer {
  margin-top: 16px;
  font-size: 13px;
  color: var(--ink-muted);
  text-align: center;
}
.footer a {
  color: var(--terra);
  text-decoration: none;
  font-weight: 700;
}
.footer a:hover { text-decoration: underline; }

/* ==========================================================================
   TITLE SCREEN & EXPEDITION COURSE GRID
   ========================================================================= */
.title {
  text-align: center;
  width: min(94vw, 560px);
}
.title .logo {
  width: 108px;
  height: 108px;
  margin: 0 auto 8px;
  filter: drop-shadow(0 6px 12px rgba(45, 26, 15, 0.28));
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.title .logo:hover {
  transform: scale(1.05) rotate(2deg);
}

.title h1 {
  margin: 0;
  font-size: 50px;
  color: var(--terra);
  letter-spacing: 0.02em;
  line-height: 1.05;
  font-weight: 700;
  text-shadow: 0 2px 0 var(--tuff-light), 0 4px 0 var(--tuff-dark);
}
.title .sub {
  margin: 8px 0 12px;
  color: var(--ink-mid);
  font-size: 16px;
  font-weight: 600;
}
.title .how {
  font-size: 13.5px;
  color: var(--ink-muted);
  margin: 0 0 16px;
